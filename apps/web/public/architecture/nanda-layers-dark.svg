<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1180 640" role="img" aria-labelledby="nanda-layers-title" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif;font-feature-settings:normal;word-spacing:0.12em"><title id="nanda-layers-title">Project NANDA&#x27;s twelve protocol layers, and which part of an estate answers each</title><defs><marker id="nanda-layers-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4d68"></path></marker><marker id="nanda-layers-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e8eef7"></path></marker><marker id="nanda-layers-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e0b062"></path></marker><marker id="nanda-layers-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"></path></marker><marker id="nanda-layers-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"></path></marker><marker id="nanda-layers-arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8db4ff"></path></marker><marker id="nanda-layers-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b79bff"></path></marker><filter id="nanda-layers-shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"></feDropShadow></filter></defs><rect x="0" y="0" width="1180" height="640" fill="#07101c"></rect><text x="40" y="44" font-size="10.5" text-anchor="start" fill="#93a4bd" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">NANDA LAYER</text><text x="260" y="44" font-size="10.5" text-anchor="start" fill="#93a4bd" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">ESTATE ELEMENT</text><text x="460" y="44" font-size="10.5" text-anchor="start" fill="#93a4bd" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">WHAT ANSWERS IT HERE</text><text x="1060" y="44" font-size="10.5" text-anchor="start" fill="#93a4bd" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">STATUS</text><g><rect x="30" y="60" width="1120" height="40" rx="6" fill="#14233a"></rect><text x="40" y="85" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01 Transport</text><text x="260" y="85" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Edge</text><text x="460" y="85" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">HTTPS A2A required · mTLS optional evidence · admission always (ADR-0057)</text><g><rect x="1060" y="70" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="82.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="104" width="1120" height="40" rx="6" fill="transparent"></rect><text x="40" y="129" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">02 Communication</text><text x="260" y="129" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Runtime</text><text x="460" y="129" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">A2A tasks + messages · interactions · Home MCP for clients (specs 340, 397)</text><g><rect x="1060" y="114" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="126.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="148" width="1120" height="40" rx="6" fill="#14233a"></rect><text x="40" y="173" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03 Identity</text><text x="260" y="173" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Chain</text><text x="460" y="173" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">the Smart Agent account is the identity; names and cards are facets (ADR-0010)</text><g><rect x="1060" y="158" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="170.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="192" width="1120" height="40" rx="6" fill="transparent"></rect><text x="40" y="217" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">04 Registry</text><text x="260" y="217" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Registries · naming</text><text x="460" y="217" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">registry-kit instances + typed name registries; a registry lists, never grants (ADR-0038)</text><g><rect x="1060" y="202" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="214.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="236" width="1120" height="40" rx="6" fill="#14233a"></rect><text x="40" y="261" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">05 Auth</text><text x="260" y="261" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Chain · runtime</text><text x="460" y="261" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">ERC-7710 delegation + enforcers · per-step verify · intent-digest mandate (spec 350)</text><g><rect x="1060" y="246" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="258.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="280" width="1120" height="40" rx="6" fill="transparent"></rect><text x="40" y="305" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">06 Trust</text><text x="260" y="305" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Public graph · vault</text><text x="460" y="305" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">a graph read between two parties for an outcome; never a score in the directory</text><g><rect x="1060" y="290" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="302.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="324" width="1120" height="40" rx="6" fill="#14233a"></rect><text x="40" y="349" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">07 Payments</text><text x="260" y="349" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Treasury residents</text><text x="460" y="349" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">value lives only in treasuries · payment enforcer · receipts anchored (spec 420)</text><g><rect x="1060" y="334" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="346.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="368" width="1120" height="40" rx="6" fill="transparent"></rect><text x="40" y="393" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">08 Coordination</text><text x="260" y="393" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Runtime</text><text x="460" y="393" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Endeavor + CoordinationPlan between agents; orchestration within one (ADR-0054)</text><g><rect x="1060" y="378" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="390.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="412" width="1120" height="40" rx="6" fill="#14233a"></rect><text x="40" y="437" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">09 Negotiation</text><text x="260" y="437" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Runtime</text><text x="460" y="437" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">intent engagement: projections → probes → offers → mandate (spec 336)</text><g><rect x="1060" y="422" width="62.81551999999999" height="20" rx="4" fill="#33270f" stroke="#e0b062" stroke-width="1"></rect><text x="1069" y="434.5" font-size="10" font-weight="600" fill="#e0b062" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">PENDING</tspan></text></g></g><g><rect x="30" y="456" width="1120" height="40" rx="6" fill="transparent"></rect><text x="40" y="481" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">10 Memory</text><text x="260" y="481" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Vault</text><text x="460" y="481" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">vault-resident records and memory; never a platform store (ADR-0055)</text><g><rect x="1060" y="466" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="478.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="500" width="1120" height="40" rx="6" fill="#14233a"></rect><text x="40" y="525" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">11 Privacy</text><text x="260" y="525" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Vault · public graph</text><text x="460" y="525" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">two tiers never joined; private resolution grants; public tier holds only chain facts</text><g><rect x="1060" y="510" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="522.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><g><rect x="30" y="544" width="1120" height="40" rx="6" fill="transparent"></rect><text x="40" y="569" font-size="12" text-anchor="start" fill="#8db4ff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">12 Data facts</text><text x="260" y="569" font-size="12" text-anchor="start" fill="#e8eef7" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Public graph · chain</text><text x="460" y="569" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">signed profile + sequenced publication + PROV-O receipts; the agent signs, not the index</text><g><rect x="1060" y="554" width="40.37744" height="20" rx="4" fill="#0d2f31" stroke="#2dd4bf" stroke-width="1"></rect><text x="1069" y="566.5" font-size="10" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan></text></g></g><text x="30" y="602" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Where the stacks agree: a lean index, a signed facts document, a quilt of registries.</text><text x="30" y="620" font-size="11" text-anchor="start" fill="#93a4bd" font-weight="500" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Where they differ: here the agent signs its own address and facts, a resolver issues no tokens, and a registry delists but cannot revoke.</text><g><g transform="translate(998 614) scale(0.22)" fill="#93a4bd"><path d="M32 3 L59 39 H48.2 L32 16.2 L15.8 39 H5 Z"></path><rect x="17" y="43.2" width="30" height="7" rx="3.5"></rect><rect x="10" y="54" width="44" height="7" rx="3.5"></rect></g><text x="1148" y="626" font-size="9.5" text-anchor="end" fill="#93a4bd" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agenticprimitives.dev</text></g></svg>
