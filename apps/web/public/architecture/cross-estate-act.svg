idth="142.11840000000007" height="15.5" rx="3" fill="#ffffff" opacity="0.92"></rect><text x="1130" y="272" font-size="9.5" text-anchor="end" fill="#0f766e" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">5 executes under the grant</text></g><g><path d="M 790 380 C 600 450, 300 450, 230 370" fill="none" stroke="#b45309" stroke-width="2.25" marker-end="url(#cross-estate-arrow-amber)" stroke-linecap="round" opacity="0.9"></path><rect x="406.76714999999996" y="430.5" width="206.4657000000001" height="15.5" rx="3" fill="#ffffff" opacity="0.92"></rect><text x="510" y="440" font-size="9.5" text-anchor="middle" fill="#b45309" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">6 receipt → her vault, apexec:estate = B</text></g><g><rect x="30" y="476" width="248.84552000000014" height="20" rx="4" fill="#e0f2f1" stroke="#0f766e" stroke-width="1"></rect><text x="39" y="488.5" font-size="10" font-weight="600" fill="#0f766e" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">LIVE</tspan>  ·  read + routed act, Faithnet A ↔ B</text></g><g><rect x="330" y="476" width="362.8676000000002" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1"></rect><text x="339" y="488.5" font-size="10" font-weight="600" fill="#b45309" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1">PENDING</tspan>  ·  completion · hand-off · three-link chain (G4–G6)</text></g><g><rect x="720" y="476" width="300.5904800000001" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"></rect><text x="729" y="488.5" font-size="10" font-weight="600" fill="#0f172a" font-