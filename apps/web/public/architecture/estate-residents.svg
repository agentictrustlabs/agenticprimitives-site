0" fill="#0b2a4a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alice.me</text><text x="92" y="178" font-size="7.5" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">a Home is where she signs</text></g><g><rect x="60" y="198" width="150" height="44" rx="8" fill="#ffffff" stroke="#0b2a4a" stroke-width="1.25"></rect><g stroke="#0b2a4a" fill="none" stroke-width="1.6"><circle cx="77" cy="212.2" r="3.08"></circle><path d="M 71.4 222 a 5.6000000000000005 5.6000000000000005 0 0 1 11.200000000000001 0"></path></g><text x="92" y="218" font-size="12" font-weight="600" fill="#0b2a4a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">nathan.me</text><text x="92" y="232" font-size="9.5" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">steward of two orgs</text></g><text x="330" y="78" font-size="10.5" text-anchor="start" fill="#6d28d9" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">ORGANIZATIONS · .ORG .TEAM</text><g><rect x="330" y="90" width="200" height="44" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.25"></rect><g stroke="#6d28d9" fill="none" stroke-width="1.6"><rect x="341" y="103.5" width="12" height="10.5" rx="1.5"></rect><path d="M 344.2 103.5 v -2.8000000000000003 h 5.6000000000000005 v 2.8000000000000003"></path></g><text x="362" y="110" font-size="12" font-weight="600" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">calvary.org</text><text x="362" y="124" font-size="9.5" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">holds members and teams</text></g><g><rect x="330" y="144" width="200" height="44" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.25"></rect><g stroke="#6d28d9" fill="none" stroke-width="1.6"><rect x="341" y="157.5" width="12" height="10.5" rx="1.5"></rect><path d="M 344.2 157.5 v -2.8000000000000003 h 5.6000000000000005 v 2.8000000000000003"></path></g><text x="362" y="164" font-size="12" font-weight="600" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">outreach.team</text><text x="362" y="178" font-size="9.5" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">a team is an organization</text></g><g><rect x="330" y="198" width="200" height="44" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="1.25"></rect><g stroke="#6d28d9" fill="none" stroke-width="1.6"><rect x="341" y="211.5" width="12" height="10.5" rx="1.5"></rect><path d="M 344.2 211.5 v -2.8000000000000003 h 5.6000000000000005 v 2.8000000000000003"></path></g><text x="362" y="218" font-size="12" font-weight="600" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">northern-field.org</text><text x="362" y="232" font-size="9.5" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">governs a workspace</text></g><text x="650" y="78" font-size="10.5" text-anchor="start" fill="#0f766e" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.6">SERVICES · .SVC .TREASURY .WORKSPACE</text><g><rect x="650" y="90" width="210" height="44" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.25"></rect><g stroke="#0f766e" fill="none" stroke-width="1.6"><circle cx="667" cy="107" r="5.88"></circle><circle cx="667" cy="107" r="2.1"></circle></g><text x="682" y="110" font-size="12" font-weight="600" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">alice2.treasury</text><text x="682" y="124" font-size="9.5" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">the only place value lives</text></g><g><rect x="650" y="144" width="210" height="44" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.25"></rect><g stroke="#0f766e" fill="none" stroke-width="1.6"><circle cx="667" cy="161" r="5.88"></circle><circle cx="667" cy="161" r="2.1"></circle></g><text x="682" y="164" font-size="12" font-weight="600" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">corridor.workspace</text><text x="682" y="178" font-size="9" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">coordinates; cannot have members</text></g><g><rect x="650" y="198" width="210" height="44" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.25"></rect><g stroke="#0f766e" fill="none" stroke-width="1.6"><circle cx="667" cy="215" r="5.88"></circle><circle cx="667" cy="215" r="2.1"></circle></g><text x="682" y="218" font-size="12" font-weight="600" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">discovery.registry</text><text x="682" y="232" font-size="9.5" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">operates a registry</text></g><g><rect x="910" y="90" width="210" height="152" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"></rect><text x="922" y="114.6" font-size="14" font-weight="600" fill="#0f172a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">Between them</text><text x="922" y="131.975" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif" opacity="0.86">membership: person → org</text><text x="922" y="146.67499999999998" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif" opacity="0.86">stewardship: person oversees org</text><text x="922" y="161.375" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif" opacity="0.86">team of: team → org</text><text x="922" y="176.075" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif" opacity="0.86">governed by: workspace → org</text><text x="922" y="190.77499999999998" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif" opacity="0.86">chartered under: service → holder</text><text x="922" y="205.475" font-size="10.5" fill="#0f172a" text-anchor="start" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif" opacity="0.86">delegation: any → any, caveated</text></g><g><path d="M 322 319.8 L 595 300 L 868 319.8 Z" fill="#b45309" opacity="0.92"></path><rect x="330" y="319.8" width="530" height="90.2" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"></rect><text x="340" y="341.5" font-size="13" font-weight="650" fill="#b45309" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">faithchain · the estate chain</text><text x="340" y="358.25" font-size="10.5" fill="#0f172a" opacity="0.86" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">AgentAccount + CustodyPolicy · DelegationManager</text><text x="340" y="372.425" font-size="10.5" fill="#0f172a" opacity="0.86" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">name registries · ReceiptAnchorRegistry</text><text x="340" y="404" font-size="9.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">every resident is an AgentAccount here</text><g stroke="#b45309" stroke-width="1.5"><line x1="848" y1="409" x2="848" y2="394"></line><line x1="839" y1="409" x2="839" y2="394"></line><line x1="830" y1="409" x2="830" y2="394"></line><line x1="821" y1="409" x2="821" y2="394"></line></g></g><g><path d="M 135 246 C 135 290, 330 290, 360 300" fill="none" stroke="#0b2a4a" stroke-width="2.25" marker-end="url(#estate-residents-arrow-navy)" stroke-linecap="round" opacity="0.9"></path></g><g><path d="M 430 246 V 296" fill="none" stroke="#6d28d9" stroke-width="2.25" marker-end="url(#estate-residents-arrow-violet)" stroke-linecap="round" opacity="0.9"></path><rect x="435" y="272.5" width="54.0059" height="15.5" rx="3" fill="#ffffff" opacity="0.92"></rect><text x="440" y="282" font-size="9.5" text-anchor="start" fill="#6d28d9" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">anchored</text></g><g><path d="M 755 246 C 755 290, 800 290, 800 296" fill="none" stroke="#0f766e" stroke-width="2.25" marker-end="url(#estate-residents-arrow-teal)" stroke-linecap="round" opacity="0.9"></path></g><g><path d="M 1015 246 C 1015 290, 880 330, 864 340" fill="none" stroke="#94a3b8" stroke-width="2.25" stroke-dasharray="7 5" marker-end="url(#estate-residents-arrow)" stroke-linecap="round" opacity="0.9"></path><rect x="830.8897" y="280.5" width="184.11030000000005" height="15.5" rx="3" fill="#ffffff" opacity="0.92"></rect><text x="1010" y="290" font-size="9.5" text-anchor="end" fill="#64748b" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">public relationships are chain state</text></g><g><rect x="60" y="448" width="691.2178480000006" height="23" rx="11.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"></rect><text x="405.6089240000003" y="463.46" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif">The address is the identity. A name, a card, a registry entry and a profile are facets that point at it.</text></g><g><g transform="translate(998 474) scale(0.22)" fill="#64748b"><path d="M32 3 L59 39 H48.2 L32 16.2 L15.8 39 H5 Z"></path><rect x="17" y="43.2" width="30" height="7" rx="3.5"></rect><rect x="10" y="54" width="44" height="7" rx="3.5"></rect></g><text x="1148" y="486" font-size="9.5" text-anchor="end" fill="#64748b" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agenticprimitives.dev</text></g></svg>
