<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1180 500" role="img" aria-labelledby="estate-residents-title" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block;font-family:ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Inter, sans-serif;font-feature-settings:normal;word-spacing:0.12em"><title id="estate-residents-title">Who lives in an estate: people, organizations and services, each a Smart Agent account on the estate chain, each with a typed name</title><defs><marker id="estate-residents-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"></path></marker><marker id="estate-residents-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"></path></marker><marker id="estate-residents-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"></path></marker><marker id="estate-residents-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"></path></marker><marker id="estate-residents-arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#be123c"></path></marker><marker id="estate-residents-arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b2a4a"></path></marker><marker id="estate-residents-arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"></path></marker><filter id="estate-residents-shadow" x="-10%" y="-10%" width="120%" heigh